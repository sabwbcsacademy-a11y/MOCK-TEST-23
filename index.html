        { q: "৪০. বায়ুমণ্ডলের কোন স্তরে ওজোন স্তর অবস্থিত?", options: ["(A) ট্রপোস্ফিয়ার", "(B) স্ট্র্যাটোস্ফিয়ার", "(C) মেসোস্ফিয়ার", "(D) থার্মোস্ফিয়ার"], ans: 1 },
        { q: "৪১. নিচের কোনটি পুনর্নবীকরণযোগ্য শক্তির উৎস?", options: ["(A) কয়লা", "(B) পেট্রোলিয়াম", "(C) সৌরশক্তি", "(D) প্রাকৃতিক গ্যাস"], ans: 2 },
        { q: "৪২. নিচের কোনটি জৈব-বিয়োজ্য পদার্থ?", options: ["(A) প্লাস্টিকের বোতল", "(B) কাচ", "(C) সবজির খোসা", "(D) অ্যালুমিনিয়ামের ক্যান"], ans: 2 },
        { q: "৪৩. একজন পিতা ও তাঁর পুত্রের বর্তমান বয়সের অনুপাত ৫ : ২। ৬ বছর পরে তাঁদের বয়সের অনুপাত ২ : ১ হবে। পিতার বর্তমান বয়স কত?", options: ["(A) ২৪ বছর", "(B) ৩০ বছর", "(C) ৩৬ বছর", "(D) ৪০ বছর"], ans: 1 },

        { q: "৫০. দুটি সংখ্যার অনুপাত ৩ : ৫ এবং তাদের যোগফল ৬৪। ছোট সংখ্যাটি কত?", options: ["(A) ১৮", "(B) ২৪", "(C) ৩২", "(D) ৪০"], ans: 1 }
    ];

    let timerInterval;
    let timeLeft = 40 * 60; // 40 minutes
    let studentData = {};

    function startQuiz(e) {
        e.preventDefault();
        
        const nameInput = document.getElementById('fullName').value.trim();
        const mobileInput = document.getElementById('mobileNum').value.trim();
        
        const nameError = document.getElementById('nameError');
        const mobileError = document.getElementById('mobileError');
        
        nameError.style.display = 'none';
        mobileError.style.display = 'none';
        
        // Regex: English and Bengali text + spaces only
        const nameRegex = /^[A-Za-z\u0980-\u09FF\s]+$/;
        // Regex: Exactly 10 digits
        const mobileRegex = /^[0-9]{10}$/;
        
        let valid = true;
        
        if (!nameRegex.test(nameInput)) {
            nameError.style.display = 'block';
            valid = false;
        }
        
        if (!mobileRegex.test(mobileInput)) {
            mobileError.style.display = 'block';
            valid = false;
        }
        
        if (!valid) return;
        
        studentData = { name: nameInput, mobile: mobileInput };
        
        document.getElementById('login-sec').classList.add('hidden');
        document.getElementById('quiz-sec').classList.remove('hidden');
        document.getElementById('candidate-name').innerText = nameInput;
        
        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        
        quizData.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'q-card';
            
            let optionsHTML = '';
            q.options.forEach((opt, optIdx) => {
                optionsHTML += `
                    <label class="option-label" id="opt-label-${index}-${optIdx}">
                        <input type="radio" name="q${index}" value="${optIdx}">
                        ${opt}
                    </label>
                `;
            });
            
            card.innerHTML = `
                <div class="q-title">${q.q}</div>
                <div>${optionsHTML}</div>
            `;
            container.appendChild(card);
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `Time Remaining: ${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Time is up! Submitting test automatically.");
                submitQuiz();
            }
        }, 1000);
    }

    function submitQuiz() {
        clearInterval(timerInterval);
        
        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;
        
        quizData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected) {
                const val = parseInt(selected.value);
                if (val === q.ans) {
                    score += 1;
                    correctCount++;
                } else {
                    score -= 0.25;
                    wrongCount++;
                }
            }
        });

        studentData.score = score;
        studentData.total = quizData.length;

        // Display results
        document.getElementById('quiz-sec').classList.add('hidden');
        document.getElementById('result-sec').classList.remove('hidden');
        document.getElementById('score-text').innerText = `Score: ${score} / ${quizData.length} (Correct: ${correctCount}, Wrong: ${wrongCount})`;

        // Preview answer key
        renderReview();

        // Send to Google Sheets
        sendDataToSheets();
    }

    function renderReview() {
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';

        quizData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const userAns = selected ? parseInt(selected.value) : -1;

            const card = document.createElement('div');
            card.className = 'q-card';

            let optionsHTML = '';
            q.options.forEach((opt, optIdx) => {
                let statusClass = '';
                
                if (optIdx === q.ans) {
                    statusClass = 'correct-ans'; // Highlight green for correct answer
                }
                if (userAns === optIdx && userAns !== q.ans) {
                    statusClass = 'wrong-ans'; // Highlight red for wrong selected attempt
                }

                optionsHTML += `
                    <div class="option-label ${statusClass}">
                        ${opt} ${optIdx === q.ans ? ' ✔ (Correct Answer)' : ''} ${userAns === optIdx && userAns !== q.ans ? ' ✖ (Your Choice)' : ''}
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="q-title">${q.q}</div>
                <div>${optionsHTML}</div>
            `;
            reviewContainer.appendChild(card);
        });
    }

    function sendDataToSheets() {
        if (!SCRIPT_URL || SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
            document.getElementById('sub-status').innerText = "Result calculated. (Google Sheets URL not configured)";
            return;
        }

        document.getElementById('sub-status').innerText = "Sending data to Google Sheet...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(studentData)
        })
        .then(() => {
            document.getElementById('sub-status').innerText = "Data successfully saved to Google Sheet!";
        })
        .catch(err => {
            console.error('Error:', err);
            document.getElementById('sub-status').innerText = "Failed to submit data to Google Sheet.";
        });
    }
</script>
